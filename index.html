<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A no-fuss student search (HTML/CSS/JS) with dark mode + animations just enter a roll number to see full academic/contact details instantly.">
    <meta name="author" content="Saabir Dahir">
    <title>Students Details Search Engine</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="search-container">
        <h1 class="title">Students Details Search Engine</h1>
        <div class="search-box">
            <input type="text" id="search-input" placeholder="Search by Roll Number" autocomplete="off">
            <button onclick="searchStudent()">Search</button>
        </div>
        <div id="result" class="result"></div>

        <footer class="footer">
        <p>Developed by Saabir Dahir</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
